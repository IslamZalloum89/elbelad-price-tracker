name: Elbelad Price Tracker

on:
  schedule:
    # يشتغل كل 3 ساعات - عدّل حسب حاجتك (صيغة cron بتوقيت UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # يسمح بتشغيله يدويًا من تبويب Actions بجيت هب

jobs:
  track-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright gspread google-auth requests
          playwright install --with-deps chromium

      - name: Run price tracker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python scrape_prices.py
